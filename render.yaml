services:
  - type: web
    name: kpi-tablero
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kpi-db
          property: connectionString
      - key: RENDER
        value: true